<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crezia — Prototipo de diseño</title>
<meta name="color-scheme" content="light dark">
<script>
/* Aplica el tema guardado ANTES de pintar (sin parpadeo). Sin elección guardada, o sin localStorage, manda el sistema. */
(function(){try{var t=localStorage.getItem('crezia-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<meta name="description" content="Prototipo navegable de las pantallas de Crezia (escritorio primero). Datos simulados; no está conectado a la API.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS SEMÁNTICOS. Los componentes solo usan estos nombres; los valores cambian por tema.
   Identidad Crezia: turquesa, blanco, logo "C" con flecha, lema "Finanzas y Ahorro". Sin JAC.
   --accent-solid es el turquesa de marca de los mockups (#00C9D1): con texto blanco da 2,04:1, así que
   las acciones usan --primary (derivado) y el texto sobre el turquesa es oscuro.
   Tema: sistema por defecto; data-theme="light|dark" en <html> lo fuerza (elección guardada del usuario).
   ============================================================ */
:root{
  color-scheme:light;
  --bg:#F4FBFC; --surface:#FFFFFF; --surface-2:#E6F9FA;
  --text:#0B2B30; --text-2:#4A5F63;
  --border:#CFE3E5; --border-strong:#5B8A90;
  --primary:#087F8A; --primary-hover:#076F79; --on-primary:#FFFFFF; --link:#06707A;
  --accent:#00C9D1; --accent-solid:#00C9D1; --on-accent:#0B2B30;
  --success:#17622F; --success-bg:#E5F4EA;
  --error:#B3261E; --error-bg:#FDECEA;
  --warning:#8A5300; --warning-bg:#FFF4DC;
  --info:#055A63; --info-bg:#E6F9FA;
  --neutral-bg:#EEF3F4;
  --danger-solid:#B3261E; --danger-solid-hover:#8F1D17; --on-danger:#FFFFFF;
  --focus:#0B2B30; --focus-halo:#FFFFFF;
  --track:#D3E8EB; --row-hover:#F1FAFB; --skeleton-1:#E3F1F3; --skeleton-2:#F1FAFB;
  --disabled-bg:#EEF3F4; --disabled-text:#566A6D; --disabled-border:#B9CCCF;
  --inverse-bg:#0B2B30; --inverse-text:#FFFFFF;
  --proto-bg:#0B2B30; --proto-text:#FFFFFF; --proto-border:#0B2B30;
  --overlay:rgba(11,43,48,.5); --shadow:0 1px 2px rgba(11,43,48,.08),0 6px 20px rgba(11,43,48,.06);
  --show-light-logo:block; --show-dark-logo:none;
}
/* Oscuro: valores compartidos por la preferencia del sistema y por la elección manual (se mantienen iguales). */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#071A1D; --surface:#0E2A2F; --surface-2:#153A40;
    --text:#E8F6F7; --text-2:#A9C4C7;
    --border:#24474D; --border-strong:#6A9CA2;
    --primary:#2CD3DB; --primary-hover:#5EE3E9; --on-primary:#031F23; --link:#5EE3E9;
    --accent:#0D4D55; --accent-solid:transparent; --on-accent:#E8F6F7;
    --success:#6EDC93; --success-bg:#12331F;
    --error:#FF9B92; --error-bg:#3D1714;
    --warning:#F6BD5A; --warning-bg:#3A2A08;
    --info:#7FE6EB; --info-bg:#12424A;
    --neutral-bg:#1B3A40;
    --danger-solid:#FF8A80; --danger-solid-hover:#FFB0A9; --on-danger:#2B0B09;
    --focus:#7FE6EB; --focus-halo:#071A1D;
    --track:#24474D; --row-hover:#123137; --skeleton-1:#153A40; --skeleton-2:#1E4950;
    --disabled-bg:#12292D; --disabled-text:#8CA9AD; --disabled-border:#2C4C52;
    --inverse-bg:#E8F6F7; --inverse-text:#071A1D;
    --proto-bg:#02090A; --proto-text:#CFE3E5; --proto-border:#24474D;
    --overlay:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.35);
    --show-light-logo:none; --show-dark-logo:block;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#071A1D; --surface:#0E2A2F; --surface-2:#153A40;
  --text:#E8F6F7; --text-2:#A9C4C7;
  --border:#24474D; --border-strong:#6A9CA2;
  --primary:#2CD3DB; --primary-hover:#5EE3E9; --on-primary:#031F23; --link:#5EE3E9;
  --accent:#0D4D55; --accent-solid:transparent; --on-accent:#E8F6F7;
  --success:#6EDC93; --success-bg:#12331F;
  --error:#FF9B92; --error-bg:#3D1714;
  --warning:#F6BD5A; --warning-bg:#3A2A08;
  --info:#7FE6EB; --info-bg:#12424A;
  --neutral-bg:#1B3A40;
  --danger-solid:#FF8A80; --danger-solid-hover:#FFB0A9; --on-danger:#2B0B09;
  --focus:#7FE6EB; --focus-halo:#071A1D;
  --track:#24474D; --row-hover:#123137; --skeleton-1:#153A40; --skeleton-2:#1E4950;
  --disabled-bg:#12292D; --disabled-text:#8CA9AD; --disabled-border:#2C4C52;
  --inverse-bg:#E8F6F7; --inverse-text:#071A1D;
  --proto-bg:#02090A; --proto-text:#CFE3E5; --proto-border:#24474D;
  --overlay:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.35);
  --show-light-logo:none; --show-dark-logo:block;
}
:root{
  --radius:12px; --radius-lg:20px;
  --font:'Montserrat','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --script:'Dancing Script','Segoe Script','Brush Script MT',cursive;
  --sidebar:248px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
::placeholder{color:var(--text-2);opacity:1}
a{color:var(--link)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--inverse-bg);color:var(--inverse-text);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{top:36px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px var(--focus-halo)}
/* El <main> recibe el foco por código al navegar (lectores de pantalla); no es interactivo, así que no lleva anillo. */
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none;box-shadow:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Franja de prototipo */
.proto-bar{background:var(--proto-bg);color:var(--proto-text);border-bottom:1px solid var(--proto-border);font-size:12px;text-align:center;padding:6px 12px;letter-spacing:.2px}

/* Marca. El logo tiene dos versiones: la original (tema claro) y una variante para fondo oscuro. */
.logo{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none;background:var(--accent-solid)}
.logo img{display:block}
.logo .l-light{width:122%;height:122%;margin:-11% 0 0 -11%;object-fit:cover;display:var(--show-light-logo)}
.logo .l-dark{width:100%;height:100%;display:var(--show-dark-logo)}
.wordmark{font-weight:800;letter-spacing:.5px;color:var(--link);line-height:1}
.slogan{font-family:var(--script);font-weight:600}
.brand-row{display:flex;align-items:center;gap:12px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;letter-spacing:.3px}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.secondary{background:var(--surface);color:var(--link)}
.btn.secondary:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger-solid);border-color:var(--danger-solid);color:var(--on-danger)}
.btn.danger:hover{background:var(--danger-solid-hover);border-color:var(--danger-solid-hover)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btn[disabled]{background:var(--disabled-bg);border-color:var(--disabled-border);color:var(--disabled-text);cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--link);border-color:var(--border)}
.icon-btn[disabled]{cursor:not-allowed;color:var(--disabled-text)}
.icon-btn[disabled]:hover{background:transparent;border-color:transparent;color:var(--disabled-text)}
.icon-btn svg{width:20px;height:20px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.legend{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--text-2)}
.input,.select,.textarea{min-height:44px;width:100%;padding:10px 14px;border:1.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text)}
.textarea{min-height:88px;resize:vertical}
.input:hover,.select:hover,.textarea:hover{border-color:var(--primary)}
.input:disabled,.select:disabled,.textarea:disabled{background:var(--disabled-bg);color:var(--disabled-text);-webkit-text-fill-color:var(--disabled-text);border-color:var(--disabled-border);cursor:not-allowed;opacity:1}
.field.invalid .input,.field.invalid .select,.field.invalid .textarea{border-color:var(--error);box-shadow:inset 0 0 0 1px var(--error)}
.error-msg{color:var(--error);font-size:13px;font-weight:600;display:none}
.field.invalid .error-msg{display:block}
.field.invalid .error-msg::before{content:"⚠ "}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .full{grid-column:1/-1}
.pw{position:relative}
.pw .icon-btn{position:absolute;right:2px;top:2px}
.pw .input{padding-right:48px}
.seg{display:inline-flex;border:1.5px solid var(--border-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg label{margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:10px 20px;min-height:44px;font-weight:600;font-size:14px;line-height:24px}
.seg input:checked+span{background:var(--primary);color:var(--on-primary)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
/* Elegida: el anillo interior va sobre el color primario, así que usa el color del texto del botón (≥ 3:1). */
.seg input:checked:focus-visible+span{outline-color:var(--on-primary)}
.rating{display:flex;flex-wrap:wrap;gap:8px}
.rating label{margin:0}
.rating input{position:absolute;opacity:0}
.rating span{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border-strong);font-weight:700;cursor:pointer;background:var(--surface)}
.rating input:checked+span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.rating input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-weight:500;margin:0}
.choice input{accent-color:var(--primary);width:20px;height:20px}
.choice:has(input:checked){border-color:var(--primary);background:var(--surface-2)}
.choice:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.banner{border-radius:var(--radius);padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:16px;display:flex;gap:10px}
.banner.error{background:var(--error-bg);color:var(--error);border:1px solid var(--error)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.success{background:var(--success-bg);color:var(--success);border:1px solid var(--success)}
.banner:focus{outline:none}
.banner[tabindex="-1"]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Selector de tema (claro / oscuro / sistema) */
.theme-toggle{display:inline-flex;border:1.5px solid var(--border-strong);border-radius:999px;background:var(--surface);padding:2px;gap:2px}
.theme-toggle label{margin:0;position:relative;cursor:pointer;display:block}
.theme-toggle input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.theme-toggle .tt{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;color:var(--text-2)}
.theme-toggle .tt svg{width:16px;height:16px}
.theme-toggle label:hover .tt{background:var(--surface-2);color:var(--link)}
.theme-toggle input:checked+.tt,.theme-toggle label:hover input:checked+.tt{background:var(--primary);color:var(--on-primary)}
.theme-toggle input:focus-visible+.tt{outline:3px solid var(--focus);outline-offset:2px}

/* Pantallas de acceso */
.auth{position:relative;min-height:calc(100vh - 28px);display:grid;grid-template-columns:minmax(360px,5fr) 6fr}
.auth-theme{position:absolute;top:14px;right:14px;z-index:5}
.auth-side{background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:48px clamp(32px,6vw,96px);gap:20px}
.auth-side .logo{width:112px;height:112px;border-radius:28px;box-shadow:0 10px 30px rgba(5,90,99,.3)}
.auth-side .wordmark{font-size:56px;color:var(--on-accent)}
.auth-side .slogan{font-size:34px;color:var(--on-accent)}
.auth-side p{max-width:34ch;margin:0;font-size:16px}
.auth-main{display:flex;align-items:center;justify-content:center;padding:64px 24px 40px;background:var(--surface)}
.auth-card{width:100%;max-width:480px}
.auth-card h1{font-size:26px;margin:0 0 6px}
.auth-card .lead{color:var(--text-2);margin:0 0 24px}
.auth-links{text-align:center;margin-top:18px;font-size:14px}
.stepper{display:flex;gap:8px;margin:4px 0 24px}
.stepper i{flex:1;height:6px;border-radius:99px;background:var(--track)}
.stepper i.on{background:var(--primary)}
.step-actions{display:flex;gap:12px;justify-content:space-between;margin-top:8px}
.step-actions .btn{flex:1}

/* App */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:calc(100vh - 28px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:calc(100vh - 28px);align-self:start;z-index:15}
.sidebar .brand-row{padding:4px 8px 22px}
.sidebar .wordmark{font-size:22px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:600}
.nav a svg{width:22px;height:22px;flex:none}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--info-bg);color:var(--info);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;letter-spacing:.3px}
.avatar.lg{width:64px;height:64px;font-size:22px}
.user-wrap{position:relative}
.user-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 8px;border:1px solid transparent;border-radius:12px;background:none;cursor:pointer;text-align:left;color:var(--text)}
.user-btn:hover,.user-btn[aria-expanded="true"]{background:var(--surface-2);border-color:var(--border)}
.user-btn .u-text{min-width:0;flex:1}
.user-btn b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font-size:14px;line-height:1.25}
.user-btn small{display:block;color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-btn .chev{width:16px;height:16px;color:var(--text-2);flex:none}
.user-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.user-btn.compact{width:auto;min-height:44px;padding:2px;border-radius:999px}
.user-menu{display:none;position:absolute;z-index:40;min-width:220px;padding:6px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow)}
.user-menu.open{display:block}
.user-wrap.sb .user-menu{left:0;bottom:calc(100% + 6px)}
.user-wrap.tb .user-menu{right:0;top:calc(100% + 8px)}
.user-menu [role="menuitem"]{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--text);font-weight:600;font-size:14px;text-decoration:none;text-align:left;cursor:pointer}
.user-menu [role="menuitem"] svg{width:20px;height:20px;flex:none;color:var(--text-2)}
.user-menu [role="menuitem"]:hover{background:var(--surface-2)}
.user-menu [role="menuitem"]:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;box-shadow:none;background:var(--surface-2)}
.user-menu [role="menuitem"][aria-current="page"]{background:var(--surface-2)}
.topbar{display:none}
.top-actions{display:flex;align-items:center;gap:4px}
.bottomnav{display:none}
.main{padding:28px clamp(20px,3vw,44px) 56px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{margin:0;font-size:28px;line-height:1.2}
.page-head p{margin:4px 0 0;color:var(--text-2);max-width:62ch}
.page-head>div:first-child{flex:1 1 260px;min-width:0}
.head-actions{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;flex-wrap:wrap;flex:none}
.head-actions .theme-toggle{margin-bottom:4px}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:12px;align-items:end;padding:16px 18px;margin-bottom:16px}
.filters .field{margin:0;min-width:0}
.filters .input,.filters .select{min-width:0}
.filters label{font-size:13px}

/* Tabla */
.table-wrap{overflow-x:auto;overflow-y:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2);text-align:left;padding:12px 18px;background:var(--surface-2);font-weight:700}
td{padding:14px 18px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--row-hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.actions,th.actions{width:1%;white-space:nowrap;text-align:right}
.amount{font-weight:700}
.amount.income{color:var(--success)}
.amount.expense{color:var(--error)}
.cell-title{font-weight:600}
.cell-sub{font-size:13px;color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--success-bg);color:var(--success)}
.chip.neutral{background:var(--neutral-bg);color:var(--text-2)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.danger{background:var(--error-bg);color:var(--error)}
.chip.warn{background:var(--warning-bg);color:var(--warning)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--border);font-size:14px;color:var(--text-2)}
.pager .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pager select{min-height:40px;width:auto;padding:6px 10px}
.pager .btn{min-height:40px;padding:0 14px}
.pager .btn[disabled]{cursor:not-allowed}
.note{font-size:12.5px;color:var(--text-2);margin:10px 4px 0}

/* Tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{padding:20px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h2{margin:0;font-size:18px;line-height:1.25}
.balance{font-size:28px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.balance.neg{color:var(--error)}
.meta-line{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--text-2)}
.progress{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.progress>div{height:100%;background:var(--primary);border-radius:99px}
.progress.done>div{background:var(--success)}
.goal-nums{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.goal-nums b{font-variant-numeric:tabular-nums}
.pct{font-weight:800;font-size:22px;color:var(--info)}

/* Estados */
.state{padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.state h2{margin:0;font-size:20px}
.state p{margin:0;color:var(--text-2);max-width:46ch}
.state svg{width:44px;height:44px;color:var(--link)}
.skeleton{padding:8px 18px}
.skeleton div{height:46px;margin:12px 0;border-radius:10px;background:linear-gradient(90deg,var(--skeleton-1) 25%,var(--skeleton-2) 50%,var(--skeleton-1) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Panel */
.quote{background:var(--accent);color:var(--on-accent);border-radius:var(--radius-lg);padding:20px 26px;margin-bottom:16px;display:flex;gap:18px;align-items:center}
.quote .mark{font-weight:800;font-size:64px;line-height:.75;flex:none;padding-top:10px}
.quote p{margin:0;font-size:18px;font-weight:600}
.quote small{display:block;margin-top:4px;font-weight:600;font-size:12.5px;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:20px 22px}
.kpi.balance{border-top:4px solid var(--primary)}
.kpi-label{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2)}
.kpi-value{font-size:30px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;margin:6px 0 8px;line-height:1.15}
.kpi-value.income{color:var(--success)}
.kpi-value.expense{color:var(--error)}
.kpi-value.neg{color:var(--error)}
.compare{padding:20px 22px}
.compare h2{margin:0 0 14px;font-size:17px}
/* La barra no depende solo del color: los egresos llevan rayas y hay un hueco entre tramos. */
.bar{display:flex;gap:3px;height:16px;border-radius:99px;overflow:hidden;background:var(--track)}
.b-inc{background:var(--success)}
.b-exp{background:repeating-linear-gradient(135deg,var(--error) 0 5px,color-mix(in srgb,var(--error) 45%,var(--surface)) 5px 9px)}
.legend{display:flex;gap:8px 22px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.sw.inc{background:var(--success)}
.sw.exp{background:repeating-linear-gradient(135deg,var(--error) 0 3px,color-mix(in srgb,var(--error) 45%,var(--surface)) 3px 5px)}
.period{min-width:200px}
.period .field{margin:0}
@media (max-width:1099px){.kpis{grid-template-columns:1fr 1fr}.kpi.balance{grid-column:1/-1}}
@media (max-width:719px){.kpis{grid-template-columns:1fr}.quote{padding:16px;gap:12px}.quote .mark{font-size:34px}.quote p{font-size:16px}.kpi-value{font-size:26px}.period{width:100%}}

/* Mi perfil */
.profile-card{padding:24px 26px;max-width:880px}
.profile-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.profile-top .grow{flex:1;min-width:0}
.profile-top h2{margin:0;font-size:22px;line-height:1.25;overflow-wrap:break-word}
.pf-section{margin-top:24px}
.pf-section h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2)}
.dl{display:grid;grid-template-columns:210px minmax(0,1fr);margin:0}
.dl dt,.dl dd{margin:0;padding:12px 0;border-top:1px solid var(--border)}
.dl dt{color:var(--text-2);font-weight:600;font-size:14px}
.dl dd{overflow-wrap:anywhere}
.dl .none{color:var(--text-2)}
.pf-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px;flex-wrap:wrap}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* Diálogo */
dialog{border:0;border-radius:var(--radius-lg);padding:0;width:min(560px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.4);color:var(--text);background:var(--surface)}
dialog::backdrop{background:var(--overlay)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 4px}
.dlg-head h2{margin:0;font-size:20px}
.dlg-body{padding:12px 24px 8px;max-height:min(70vh,640px);overflow:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px 22px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--inverse-bg);color:var(--inverse-text);padding:12px 20px;border-radius:12px;font-weight:600;z-index:60;display:none;max-width:calc(100vw - 32px)}
.toast.show{display:block}

/* Panel de revisión (solo del prototipo) */
.review{position:fixed;right:14px;bottom:14px;z-index:50;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);font-size:13px;max-width:280px}
.review summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none}
.review[open] summary{border-bottom:1px solid var(--border)}
.review .body{padding:12px 14px;display:grid;gap:10px}
.review select{min-height:36px;padding:4px 8px}
.review .links{display:flex;flex-wrap:wrap;gap:6px}
.review .links a{padding:3px 8px;border-radius:8px;background:var(--surface-2);text-decoration:none;color:var(--link);font-weight:600}
.review .links a:focus-visible{outline-offset:1px}
#vp{color:var(--text-2)}

/* Tablet: barra lateral compacta */
@media (max-width:1099px){
  :root{--sidebar:92px}
  .sidebar{padding:16px 8px;align-items:stretch}
  th,td{padding-left:12px;padding-right:12px}
  .sidebar .wordmark{display:none}
  .user-btn{justify-content:center;padding:6px 0}
  .user-btn .u-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;flex:none}
  .user-btn .chev{display:none}
  .sidebar .brand-row{justify-content:center;padding:4px 0 18px}
  .nav a{flex-direction:column;justify-content:center;gap:2px;min-height:62px;padding:6px 2px;font-size:12px;text-align:center;line-height:1.15}
  .filters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .filters .clear{grid-column:1/-1;justify-self:start}
  .auth{grid-template-columns:1fr 1fr}
  .auth-side .wordmark{font-size:42px}
}
/* Celular */
@media (max-width:719px){
  :root{--sidebar:0px}
  body{font-size:16px}
  .app{display:block;padding-bottom:76px}
  .sidebar{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .topbar .logo{width:36px;height:36px;border-radius:10px}
  .topbar .wordmark{font-size:20px}
  .topbar .theme-toggle .tt{width:30px;height:30px}
  .top-actions{gap:8px}
  .head-actions{width:100%;justify-content:stretch}
  .head-actions .theme-toggle{display:none}
  .profile-card{padding:18px 16px}
  .profile-top .btn{width:100%}
  .dl{grid-template-columns:1fr}
  .dl dt{padding-bottom:0}
  .dl dd{border-top:0;padding-top:2px}
  .pf-actions .btn{flex:1}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;text-decoration:none;color:var(--text-2);font-size:12px;font-weight:600}
  .bottomnav a svg{width:24px;height:24px}
  .bottomnav a[aria-current="page"]{color:var(--link);box-shadow:inset 0 3px 0 var(--primary)}
  .main{padding:20px 16px 28px}
  .page-head h1{font-size:23px}
  .page-head .btn{width:100%}
  .filters{grid-template-columns:1fr 1fr;padding:14px}
  .filters .field:first-child,.filters .clear{grid-column:1/-1}
  .form-grid{grid-template-columns:1fr}
  .auth{display:block}
  .auth-side{flex-direction:row;align-items:center;padding:62px 20px 18px;gap:14px}
  .auth-side .logo{width:52px;height:52px;border-radius:14px}
  .auth-side .wordmark{font-size:28px}
  .auth-side .slogan{font-size:20px}
  .auth-side p{display:none}
  .auth-side>div{display:flex;flex-direction:column;gap:2px}
  .auth-theme{top:12px;right:10px}
  .auth-main{padding:24px 16px 40px;align-items:flex-start}
  .choice-grid{grid-template-columns:1fr}
  .review{right:8px;bottom:78px}
  /* Tabla → tarjetas */
  table,thead,tbody,tr,td{display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tbody tr{padding:14px 16px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
  td{border:0;padding:2px 0}
  td[data-label]::before{content:attr(data-label)": ";font-size:12px;font-weight:700;color:var(--text-2)}
  td.main-cell::before,td.amount-cell::before,td.actions::before{content:none}
  td.main-cell{grid-column:1}
  td.amount-cell{grid-column:2;grid-row:1;text-align:right}
  td.actions{grid-column:1/-1;text-align:left;padding-top:6px}
  td.actions .icon-btn{width:44px;height:44px}
  .icon-btn{width:44px;height:44px}
  .btn.block-m{width:100%}
}
@media (max-width:480px){ .pager .controls{width:100%;justify-content:space-between} }
</style>
</head>

const THEME_KEY='crezia-theme';
/* La elección se guarda en localStorage (por navegador). Si no está disponible (modo privado, bloqueado), se usa
   igual durante la sesión y, al recargar, vuelve a mandar el sistema. */
function storedTheme(){try{const v=localStorage.getItem(THEME_KEY);return v==='light'||v==='dark'?v:'system';}catch(e){return 'system';}}
function setTheme(mode){
  S.theme=mode;
  if(mode==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',mode);
  try{if(mode==='system') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY,mode);}catch(e){S.themeNotSaved=true;}
  document.querySelectorAll('.theme-toggle input').forEach(i=>{i.checked=i.value===mode;});
  themeInfo();
}
const systemDark=()=>!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
function themeInfo(){
  const el=document.getElementById('th'); if(!el) return;
  const eff=S.theme==='system'?(systemDark()?'oscuro':'claro'):(S.theme==='dark'?'oscuro':'claro');
  el.textContent='Tema aplicado: '+eff+(S.theme==='system'?' (sistema)':' (elegido)')+(S.themeNotSaved?' · sin guardar (localStorage no disponible)':'');
}

/* Panel */
const PERIODS=[['thisMonth','Este mes'],['prevMonth','Mes anterior'],['last30','Últimos 30 días'],['thisYear','Este año']];
function periodRange(key){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),iso=d=>d.toISOString().slice(0,10),u=(yy,mm,dd)=>new Date(Date.UTC(yy,mm,dd));
  if(key==='prevMonth') return [iso(u(y,m-1,1)),iso(u(y,m,0))];
  if(key==='last30') return [iso(u(y,m,n.getDate()-29)),iso(u(y,m,n.getDate()))];
  if(key==='thisYear') return [iso(u(y,0,1)),iso(u(y,11,31))];
  return [iso(u(y,m,1)),iso(u(y,m+1,0))];
}
/* Mismo cálculo que hará el endpoint de resumen: solo COP, sin borrados, en centavos. */
function summary(from,to){
  let inc=0,exp=0,count=0;
  D.movements.forEach(x=>{if(x.currencyCode!=='COP'||x.date<from||x.date>to)return;const c=Math.round(x.amount*100);count++;if(x.type==='Income')inc+=c;else exp+=c;});
  return {inc:inc/100,exp:exp/100,bal:(inc-exp)/100,count};
}

function dailyPhrase(){const n=new Date(),doy=Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(n.getFullYear(),0,0))/864e5);return PHRASES[doy%PHRASES.length];}
function viewPanel(){
  const [from,to]=periodRange(S.period), sm=summary(from,to), cop=v=>money(v,'COP');

    const rateHtml=rate===null?'':`<div class="cell-sub" style="margin-top:10px">Tasa de ahorro: <b>${rate<0?'− ':''}${String(Math.abs(rate)).replace('.',',')} %</b> de tus ingresos</div>`;
    const tot=sm.inc+sm.exp, pi=Math.round(sm.inc/tot*1000)/10, pe=Math.round((100-pi)*10)/10, pos=sm.bal>=0;
    body=`<div class="kpis">
      <article class="panel kpi"><div class="kpi-label">Ingresos</div><div class="kpi-value income">+ ${cop(sm.inc)}</div><div class="cell-sub">Total de ingresos del periodo</div></article>

      <section class="panel compare" aria-label="Ingresos frente a egresos"><h2>Ingresos frente a egresos</h2>
        <div class="bar" role="img" aria-label="Ingresos ${String(pi).replace('.',',')} % y egresos ${String(pe).replace('.',',')} % del total movido"><span class="b-inc" style="width:${pi}%"></span><span class="b-exp" style="width:${pe}%"></span></div>
        <div class="legend"><span><i class="sw inc"></i>Ingresos ${String(pi).replace('.',',')} %</span><span><i class="sw exp"></i>Egresos ${String(pe).replace('.',',')} %</span></div></section>`;
  }
  return head('Panel',`Resumen de ${fdate(from)} a ${fdate(to)}${st==='normal'&&sm.count?` · ${sm.count} movimientos`:''}.`,sel)+quote+body+`<p class="note">Datos de ejemplo, solo movimientos en COP. En la app real saldrán de GET /api/movements/summary.</p>`;
}

const PHONE_RE=/^\+?[0-9 ()-]{7,20}$/;

function setProfileSaving(on){
  const f=document.getElementById('form-profile'); if(!f) return;
  f.setAttribute('aria-busy',on?'true':'false');
  f.querySelectorAll('input,select,textarea').forEach(i=>{i.disabled=on;});
  const b=document.getElementById('pf-save'); b.disabled=on; b.innerHTML=on?'<span class="spin" aria-hidden="true"></span>Guardando…':'Guardar';
  document.getElementById('pf-cancel').disabled=on;
  document.getElementById('pf-live').textContent=on?'Guardando tus datos…':'';
}
function saveProfile(){
  const d={name:val('name'),phone:val('phone'),address:val('address'),gender:val('gender'),genderOther:val('genderOther')};
  let first=null; const bad=(id,msg)=>{setErr(id,true,msg);first=first||id;}, good=id=>setErr(id,false);
  if(!d.name) bad('name','El nombre es obligatorio'); else if(d.name.length>150) bad('name','El nombre no puede superar 150 caracteres'); else good('name');
  if(d.phone&&!PHONE_RE.test(d.phone)) bad('phone','Escribe un teléfono válido: de 7 a 20 caracteres con números, espacios, + , ( ) o guiones'); else good('phone');
  if(d.address.length>255) bad('address','La dirección no puede superar 255 caracteres'); else good('address');
  if(d.gender==='Other'&&!d.genderOther) bad('genderOther','Describe tu género cuando eliges Otro'); else good('genderOther');
  if(first){document.getElementById(first).focus();return;}
  S.profile.draft=d; S.profile.saving=true; document.getElementById('pf-banner').innerHTML='';
  setProfileSaving(true);
  setTimeout(()=>{
    if(!S.profile.saving||route().name!=='perfil') return;
    S.profile.saving=false;
    if(S.review.saveError){
      setProfileSaving(false);
      const b=document.getElementById('pf-banner');
      b.innerHTML=`<div class="banner error" id="pf-err" role="alert" tabindex="-1">${I.warn.replace('<svg','<svg width="20" height="20"')}<span>No pudimos guardar tus datos. Revisa tu conexión e inténtalo de nuevo; lo que escribiste se conserva.</span></div>`;
      document.getElementById('pf-err').focus();
      return;
    }
    Object.assign(D.user,{name:d.name,phone:d.phone||null,address:d.address||null,gender:d.gender||null,genderOther:d.gender==='Other'?d.genderOther:null});
    S.profile={mode:'view',saving:false,msg:'Tus datos se actualizaron correctamente.',draft:null};
    render(); const ok=document.getElementById('pf-ok'); if(ok) ok.focus();
  },900);
}

/* ---------- Formularios en diálogo ---------- */
const dlg=document.getElementById('dlg');
function openDialog(title,body,{submit='Guardar',danger=false,formId='form-dlg'}={}){
  dlg.innerHTML=`<form id="${formId}" method="dialog" novalidate><div class="dlg-head"><h2 id="dlg-title">${title}</h2><button type="button" class="icon-btn" data-action="close-dlg" aria-label="Cerrar">${I.plus.replace('<svg','<svg style="transform:rotate(45deg)"')}</button></div>
  <div class="dlg-body"><div id="dlg-banner"></div>${body}</div>
  <div class="dlg-foot"><button type="button" class="btn secondary" data-action="close-dlg">Cancelar</button><button type="submit" class="btn ${danger?'danger':''}">${submit}</button></div></form>`;
  if(!dlg.open) dlg.showModal();
  const first=dlg.querySelector('input:not([type=hidden]),select,textarea'); if(first) first.focus();
}
const closeDlg=()=>dlg.open&&dlg.close();
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',3200);}
function setErr(id,show,msg){const f=document.getElementById('f-'+id);if(!f)return;f.classList.toggle('invalid',show);const e=document.getElementById('e-'+id);if(e&&msg)e.textContent=msg;const i=f.querySelector('input,select,textarea');if(i)i.setAttribute('aria-invalid',show?'true':'false');}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

function catForm(c){return field('name','Nombre',input('name',{value:c?.name||'',maxlength:100,req:1}),{error:'El nombre es obligatorio'})+field('description','Descripción (opcional)',`<textarea class="textarea" id="description" name="description" maxlength="255">${esc(c?.description||'')}</textarea>`,{hint:'Máximo 255 caracteres.'});}
function accForm(a){
  const locked=a&&a.hasMovements;
  return field('bankName','Banco o entidad',input('bankName',{value:a?.bankName||'',maxlength:100,req:1}),{error:'El nombre del banco es obligatorio'})
   +field('accountAlias','Alias (opcional)',input('accountAlias',{value:a?.accountAlias||'',maxlength:100}),{hint:'Por ejemplo: Gastos o Nómina.'})
   +`<div class="form-grid">${field('accountType','Tipo de cuenta',select('accountType',Object.entries(L.accountType),a?.accountType||'Savings'))}
   ${field('currencyCode','Moneda',select('currencyCode',[['COP','COP · Peso colombiano'],['USD','USD · Dólar estadounidense']],a?.currencyCode||'COP',{disabled:locked}),{hint:locked?'No se puede cambiar la moneda de una cuenta que ya tiene movimientos.':''})}</div>`;
}
function movForm(m){
  const today=new Date().toISOString().slice(0,10), type=m?.type||'Expense';
  return field('type','Tipo',`<div class="seg" role="radiogroup" aria-label="Tipo"><label><input type="radio" name="type" value="Expense" ${type==='Expense'?'checked':''}><span>Gasto</span></label><label><input type="radio" name="type" value="Income" ${type==='Income'?'checked':''}><span>Ingreso</span></label></div>`)
   +`<div class="form-grid">${field('amount','Monto',input('amount',{inputmode:'decimal',value:m?.amount||'',req:1,ph:'0'}),{error:'El monto debe ser mayor a 0'})}
   ${field('date','Fecha',input('date',{type:'date',value:m?.date||today,req:1}),{error:'La fecha es obligatoria'})}
   ${field('categoryId','Categoría',select('categoryId',[['','Selecciona una categoría'],...D.categories.map(c=>[c.id,c.name])],m?.categoryId||''),{error:'Selecciona una categoría'})}
   ${field('bankAccountId','Cuenta',select('bankAccountId',[['','Sin cuenta'],...D.accounts.map(a=>[a.id,accName(a.id)])],m?.bankAccountId||''),{hint:'Con cuenta, la moneda es la de la cuenta.'})}
   ${field('paymentMethod','Método de pago',select('paymentMethod',Object.entries(L.payment),m?.paymentMethod||'Cash'))}
   <div id="cur-wrap">${field('currencyCode','Moneda',select('currencyCode',[['COP','COP · Peso colombiano'],['USD','USD · Dólar estadounidense']],m?.currencyCode||'COP'),{hint:'Solo se pide cuando el movimiento no tiene cuenta.'})}</div></div>`
   +field('description','Descripción (opcional)',input('description',{value:m?.description||'',maxlength:255}));
}
function goalForm(g){
  const edit=!!g, reason=g?.reason||'Travel', today=new Date().toISOString().slice(0,10);
  return field('name','Nombre de la meta',input('name',{value:g?.name||'',maxlength:100,req:1}),{error:'El nombre es obligatorio'})
   +`<div class="form-grid">${field('reason','Motivo',select('reason',Object.entries(L.reason),reason))}
   ${field('categoryId','Categoría',select('categoryId',[['','Selecciona una categoría'],...D.categories.map(c=>[c.id,c.name])],g?.categoryId||''),{hint:'Solo una meta activa por categoría. Ahorrar se registra como gasto en esta categoría.',error:'Selecciona una categoría'})}
   <div class="full" id="other-wrap" style="${reason==='Other'?'':'display:none'}">${field('reasonOther','Describe el motivo',input('reasonOther',{value:g?.reasonOther||'',maxlength:255}),{error:'Describe el motivo cuando eliges Otro'})}</div>
   ${field('targetAmount','Monto objetivo',input('targetAmount',{inputmode:'decimal',value:g?.targetAmount||'',req:1,ph:'0'}),{error:'El monto objetivo debe ser mayor que 0'})}
   ${field('currencyCode','Moneda',select('currencyCode',[['COP','COP · Peso colombiano'],['USD','USD · Dólar estadounidense']],g?.currencyCode||'COP'),{hint:'El progreso no filtra por moneda (limitación conocida de la API).'})}
   ${field('startDate','Fecha de inicio',input('startDate',{type:'date',value:g?.startDate||today,req:1}),{error:'La fecha de inicio es obligatoria'})}
   ${field('endDate','Fecha de fin',input('endDate',{type:'date',value:g?.endDate||'',req:1}),{error:'La fecha fin debe ser posterior a la fecha inicio'})}
   ${edit?`<div class="full">${field('status','Estado',select('status',Object.entries(L.status).map(([k,v])=>[k,v[0]]),g.status))}</div>`:''}</div>`;
}
function delBody(txt){return `<p>${txt}</p>`;}

/* Validación y guardado simulado */
function validate(kind,editing){
  let ok=true;const bad=(id,msg)=>{setErr(id,true,msg);ok=false;};const good=id=>setErr(id,false);
  if(kind==='cat'){val('name')?good('name'):bad('name');}
  if(kind==='acc'){val('bankName')?good('bankName'):bad('bankName');}
  if(kind==='mov'){const n=parseFloat(val('amount').replace(',','.'));(n>0)?good('amount'):bad('amount');val('date')?good('date'):bad('date');val('categoryId')?good('categoryId'):bad('categoryId');}
  if(kind==='goal'){
    val('name')?good('name'):bad('name');
    val('categoryId')?good('categoryId'):bad('categoryId');
    const t=parseFloat(val('targetAmount').replace(',','.'));(t>0)?good('targetAmount'):bad('targetAmount');
    val('startDate')?good('startDate'):bad('startDate','La fecha de inicio es obligatoria');
    const s=val('startDate'),e=val('endDate'),today=new Date().toISOString().slice(0,10);
    if(!e) bad('endDate','La fecha de fin es obligatoria');
    else if(s&&e<=s) bad('endDate','La fecha fin debe ser posterior a la fecha inicio');
    else if(!editing&&e<today) bad('endDate','La fecha fin no puede estar en el pasado');
    else good('endDate');
    (val('reason')==='Other'&&!val('reasonOther'))?bad('reasonOther'):good('reasonOther');
  }
  return ok;
}
function serverFails(kind){
  if(!S.review.saveError) return false;
  const b=document.getElementById('dlg-banner');
  b.innerHTML=`<div class="banner error" role="alert">${I.warn.replace('<svg','<svg width="20" height="20"')}<span>${kind==='goal'?SAVE_ERROR_TEXT.metas:SAVE_ERROR_TEXT.default}</span></div>`;
  return true;
}
function save(kind,id){
  const editing=!!id; if(!validate(kind,editing)) return;
  if(serverFails(kind)) return;
  if(kind==='cat'){const o={name:val('name'),description:val('description')||null};if(id)Object.assign(D.categories.find(x=>x.id===id),o);else D.categories.push({id:uid(),system:false,...o});}
  if(kind==='acc'){const o={bankName:val('bankName'),accountAlias:val('accountAlias')||null,accountType:val('accountType'),currencyCode:val('currencyCode')};if(id)Object.assign(D.accounts.find(x=>x.id===id),o);else D.accounts.push({id:uid(),balance:0,hasMovements:false,...o});}
  if(kind==='mov'){const acc=val('bankAccountId')||null;const o={type:document.querySelector('[name=type]:checked').value,amount:parseFloat(val('amount').replace(',','.')),date:val('date'),categoryId:val('categoryId'),bankAccountId:acc,currencyCode:acc?D.accounts.find(a=>a.id===acc).currencyCode:val('currencyCode'),paymentMethod:val('paymentMethod'),description:val('description')||null};if(id)Object.assign(D.movements.find(x=>x.id===id),o);else D.movements.unshift({id:uid(),...o});}
  if(kind==='goal'){const o={name:val('name'),reason:val('reason'),reasonOther:val('reason')==='Other'?val('reasonOther'):null,categoryId:val('categoryId'),targetAmount:parseFloat(val('targetAmount').replace(',','.')),currencyCode:val('currencyCode'),startDate:val('startDate'),endDate:val('endDate')};if(id){o.status=val('status');Object.assign(D.goals.find(x=>x.id===id),o);}else D.goals.push({id:uid(),status:'Active',accumulated:0,...o});}
  closeDlg();render();toast('Guardado (simulado)');
}
function remove(kind,id){
  if(S.review.saveError){serverFails(kind);return;}
  const map={cat:'categories',acc:'accounts',mov:'movements',goal:'goals'};
  D[map[kind]]=D[map[kind]].filter(x=>x.id!==id);closeDlg();render();toast('Eliminado (simulado)');
}

/* ---------- Ruteo y eventos ---------- */
const ROUTES={login:()=>viewLogin(S.loginErr),registro:viewRegister,encuesta:(s)=>viewSurvey(Number(s)||1)};
const APP={panel:viewPanel,movimientos:viewMovements,cuentas:viewAccounts,metas:viewGoals,categorias:viewCategories,perfil:viewProfile};
function route(){const h=(location.hash||'#/login').replace(/^#\//,'').split('/');return {name:h[0]||'login',arg:h[1]};}
function render(){
  const r=route(), root=document.getElementById('root');
  document.querySelectorAll('.review')[0].style.display='';
  if(APP[r.name]) root.innerHTML=shell(r.name,APP[r.name]());
  else if(ROUTES[r.name]) root.innerHTML=ROUTES[r.name](r.arg);
  else root.innerHTML=viewLogin();
  const titles={panel:'Panel',login:'Inicia sesión',registro:'Crea tu cuenta',encuesta:'Cuestionario financiero',movimientos:'Movimientos',cuentas:'Cuentas',metas:'Metas',categorias:'Categorías',perfil:'Mi perfil'};
  document.title=(titles[r.name]||'Crezia')+' — Crezia (prototipo)';
}
window.addEventListener('hashchange',()=>{S.loginErr=false;S.profile=freshProfile();render();window.scrollTo(0,0);const m=document.getElementById('contenido');if(m){m.setAttribute('tabindex','-1');m.focus({preventScroll:true});}});

const find=(arr,id)=>D[arr].find(x=>x.id===id);
/* Menú de usuario (patrón "menu button" de WAI-ARIA): Enter/Espacio/↓ abren, ↑ abre en el último, flechas/Inicio/Fin se mueven, Esc cierra y devuelve el foco, Tab cierra. */
const menuItems=m=>[...m.querySelectorAll('[role=menuitem]')];
function closeMenus(except,returnFocus){
  document.querySelectorAll('.user-menu.open').forEach(m=>{const id=m.id.slice(3); if(id===except) return; m.classList.remove('open'); const b=document.getElementById('ub-'+id); b.setAttribute('aria-expanded','false'); if(returnFocus) b.focus();});
}
function openMenu(id,focus){
  closeMenus(id); const b=document.getElementById('ub-'+id), m=document.getElementById('um-'+id); if(!b||!m) return;
  m.classList.add('open'); b.setAttribute('aria-expanded','true');
  const it=menuItems(m); if(focus==='first') it[0].focus(); if(focus==='last') it[it.length-1].focus();
}
document.addEventListener('keydown',e=>{
  const ub=e.target.closest&&e.target.closest('.user-btn');
  if(ub){const id=ub.id.slice(3);
    if(e.key==='ArrowDown'){e.preventDefault();openMenu(id,'first');}
    else if(e.key==='ArrowUp'){e.preventDefault();openMenu(id,'last');}
    else if(e.key==='Escape'){closeMenus(null,true);}
    return;}
  const m=e.target.closest&&e.target.closest('.user-menu.open'); if(!m) return;
  const it=menuItems(m), i=it.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();it[(i+1)%it.length].focus();}
  else if(e.key==='ArrowUp'){e.preventDefault();it[(i-1+it.length)%it.length].focus();}
  else if(e.key==='Home'){e.preventDefault();it[0].focus();}
  else if(e.key==='End'){e.preventDefault();it[it.length-1].focus();}
  else if(e.key==='Escape'){e.preventDefault();closeMenus(null,true);}
  else if(e.key==='Tab'){closeMenus();}
  else if(e.key===' '&&document.activeElement.tagName==='A'){e.preventDefault();document.activeElement.click();}
});
document.addEventListener('click',e=>{
  const ub=e.target.closest('[data-action="user-menu"]');
  if(ub){const id=ub.id.slice(3); const open=document.getElementById('um-'+id).classList.contains('open'); if(open) closeMenus(); else openMenu(id,e.detail===0?'first':null); return;}
  if(e.target.closest('[role=menuitem]')||!e.target.closest('.user-menu')) closeMenus();
  const pg=e.target.closest('[data-page]');
  if(pg){const k=pg.dataset.page;S.page[k].page+=Number(pg.dataset.dir);render();return;}
  const b=e.target.closest('[data-action]'); if(!b) return;
  const a=b.dataset.action,id=b.dataset.id;
  const open=(title,body,o)=>{openDialog(title,body,o);};
  switch(a){
    case 'toggle-pw':{const f=document.querySelector('form');const vals=[...f.querySelectorAll('input')].map(i=>i.value);S.showPw=!S.showPw;render();document.querySelectorAll('form input').forEach((i,n)=>i.value=vals[n]||'');break;}
    case 'logout':location.hash='#/login';break;
    case 'profile-edit':S.profile={mode:'edit',saving:false,msg:'',draft:null};render();{const f=document.getElementById('name');if(f)f.focus();}break;
    case 'profile-cancel':S.profile=freshProfile();render();{const f=document.getElementById('pf-edit');if(f)f.focus();}break;
    case 'retry':S.review.list='normal';document.getElementById('rv-state').value='normal';render();break;
    case 'close-dlg':closeDlg();break;
    case 'clear-filters':S.filters={type:'',categoryId:'',bankAccountId:'',from:'',to:''};S.filterErr=false;S.page.movimientos.page=1;render();break;
    case 'new-cat':open('Nueva categoría',catForm());dlg.dataset.k='cat';dlg.dataset.id='';break;
    case 'edit-cat':open('Editar categoría',catForm(find('categories',id)));dlg.dataset.k='cat';dlg.dataset.id=id;break;
    case 'del-cat':open('Eliminar categoría',delBody(`¿Eliminar la categoría <b>${esc(find('categories',id).name)}</b>?`),{submit:'Eliminar',danger:true});dlg.dataset.k='cat';dlg.dataset.id=id;dlg.dataset.del='1';break;
    case 'new-acc':open('Nueva cuenta',accForm());dlg.dataset.k='acc';dlg.dataset.id='';break;
    case 'edit-acc':open('Editar cuenta',accForm(find('accounts',id)));dlg.dataset.k='acc';dlg.dataset.id=id;break;
    case 'del-acc':open('Eliminar cuenta',delBody(`¿Eliminar la cuenta <b>${esc(find('accounts',id).bankName)}</b>? Sus movimientos se conservan.`),{submit:'Eliminar',danger:true});dlg.dataset.k='acc';dlg.dataset.id=id;dlg.dataset.del='1';break;
    case 'new-mov':open('Nuevo movimiento',movForm());dlg.dataset.k='mov';dlg.dataset.id='';syncMov();break;
    case 'edit-mov':open('Editar movimiento',movForm(find('movements',id)));dlg.dataset.k='mov';dlg.dataset.id=id;syncMov();break;
    case 'del-mov':open('Eliminar movimiento',delBody('¿Eliminar este movimiento?'),{submit:'Eliminar',danger:true});dlg.dataset.k='mov';dlg.dataset.id=id;dlg.dataset.del='1';break;
    case 'new-goal':open('Nueva meta',goalForm());dlg.dataset.k='goal';dlg.dataset.id='';break;
    case 'edit-goal':open('Editar meta',goalForm(find('goals',id)));dlg.dataset.k='goal';dlg.dataset.id=id;break;
    case 'del-goal':open('Eliminar meta',delBody(`¿Eliminar la meta <b>${esc(find('goals',id).name)}</b>?`),{submit:'Eliminar',danger:true});dlg.dataset.k='goal';dlg.dataset.id=id;dlg.dataset.del='1';break;
  }
});
function syncMov(){const acc=document.getElementById('bankAccountId'),w=document.getElementById('cur-wrap');if(!acc||!w)return;w.style.display=acc.value?'none':'';}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name&&t.name.indexOf('theme-')===0){setTheme(t.value);return;}
  if(t.id==='p-period'){S.period=t.value;render();const nx=document.getElementById('p-period');if(nx)nx.focus();return;}
  if(t.id==='gender'){const w=document.getElementById('other-g');if(w)w.style.display=t.value==='Other'?'':'none';}
  if(t.id==='bankAccountId') syncMov();
  if(t.id==='reason'){const w=document.getElementById('other-wrap');if(w)w.style.display=t.value==='Other'?'':'none';}
  if(t.dataset&&t.dataset.limit){S.page[t.dataset.limit].limit=Number(t.value);S.page[t.dataset.limit].page=1;render();}
  if(t.closest&&t.closest('#form-filters')){
    S.filters={type:val('f-type'),categoryId:val('f-cat'),bankAccountId:val('f-acc'),from:val('f-from'),to:val('f-to')};
    S.filterErr=!!(S.filters.from&&S.filters.to&&S.filters.from>S.filters.to);
    if(!S.filterErr) S.page.movimientos.page=1;
    render();
    const nx=document.getElementById(t.id); if(nx) nx.focus();
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='form-dlg'){ if(dlg.dataset.del) remove(dlg.dataset.k,dlg.dataset.id); else save(dlg.dataset.k,dlg.dataset.id); return; }
  if(f.id==='form-profile'){ if(!S.profile.saving) saveProfile(); return; }
  if(f.id==='form-login'){
    const em=val('email'),pw=val('password');let ok=true;
    if(!/^\S+@\S+\.\S+$/.test(em)){setErr('email',true);ok=false}else setErr('email',false);
    if(!pw){setErr('password',true);ok=false}else setErr('password',false);
    if(!ok) return;
    if(pw==='mal'){S.loginErr=true;render();return;} // demostración del error 401
    location.hash='#/panel';return;
  }
  if(f.id==='form-register'){
    let ok=true;const chk=(id,c,m)=>{setErr(id,!c,m);if(!c)ok=false;};
    chk('name',!!val('name'));chk('documentId',!!val('documentId'));
    const bd=val('birthDate');let adult=false;if(bd){const b=new Date(bd),n=new Date();let age=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))age--;adult=age>=18;}
    chk('birthDate',adult,bd?'Debes tener 18 años o más':'La fecha de nacimiento es obligatoria');
    chk('regEmail',/^\S+@\S+\.\S+$/.test(val('regEmail')));chk('regPassword',!!val('regPassword'));
    if(!ok) return; location.hash='#/encuesta/1';return;
  }
  if(f.id==='form-survey'){
    const step=Number(f.dataset.step);let ok=true;const A=S.survey;
    const num=(id,key,max)=>{const v=parseFloat(val(id).replace(',','.'));const good=!isNaN(v)&&v>=0&&(!max||v<=max);setErr(id,!good);if(!good)ok=false;else A[key]=val(id);};
    const radio=(name,key,fid)=>{const r=f.querySelector(`[name=${name}]:checked`);setErr(fid,!r);if(!r)ok=false;else A[key]=r.value;};
    if(step===1){num('monthlyIncome','monthlyIncome');num('fixedExpenses','fixedExpenses');num('antPct','antPct',100);radio('unnecessary','unnecessary','unnecessary');}
    if(step===2){radio('rating','rating','rating');radio('saves','saves','saves');num('proposed','proposed');}
    if(step===3){radio('knowledge','knowledge','knowledge');radio('detect','detect','detect');radio('method','method','method');}
    if(!ok) return;
    if(step<3) location.hash='#/encuesta/'+(step+1); else {S.survey={};location.hash='#/panel';toast('Encuesta enviada (simulado)');}
  }
});

/* Panel de revisión */
document.getElementById('rv-state').addEventListener('change',e=>{S.review.list=e.target.value;render();});
document.getElementById('rv-save').addEventListener('change',e=>{S.review.saveError=e.target.checked;});
document.getElementById('rv-links').innerHTML=[['login','Login'],['registro','Registro'],['panel','Panel'],['encuesta/1','Encuesta 1'],['encuesta/2','Encuesta 2'],['encuesta/3','Encuesta 3'],['movimientos','Movimientos'],['cuentas','Cuentas'],['metas','Metas'],['categorias','Categorías'],['perfil','Mi perfil']].map(([h,t])=>`<a href="#/${h}">${t}</a>`).join('');
const vp=()=>{const w=innerWidth;document.getElementById('vp').textContent='Ancho: '+w+' px · '+(w>=1100?'escritorio':w>=720?'tablet':'celular');};
addEventListener('resize',vp);vp();
themeInfo();
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeInfo);
render();
</script>
