# SonarCloud analysis, run by .github/workflows/ci.yml (job "Sonar Analysis").
sonar.projectKey=AnyiManco848
# TODO: replace with the organization key shown in SonarCloud (My Account > Organizations).
sonar.organization=AnyiManco848

sonar.sourceEncoding=UTF-8

# Backend (repository root) and frontend (frontend/).
sonar.sources=src,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Coverage reports (LCOV) produced by "npm run test:coverage" in each package. The CI job prefixes the frontend paths with
# "frontend/" so every SF: line is relative to this folder.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,frontend/coverage/lcov.info

# Not analysed: dependencies, build output, generated code, migrations, docs, screenshots, API/E2E suites and test files.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/generated/**,prisma/migrations/**,docs/**,**/capturas/**,**/screenshots/**,frontend/e2e/**,tests/api/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,frontend/src/test/**
sonar.test.exclusions=**/node_modules/**,frontend/e2e/**,tests/api/**,**/*.spec.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,src/generated/**,src/config/**,frontend/src/main.tsx,frontend/src/test/**

# Make the scan step fail when the Quality Gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
